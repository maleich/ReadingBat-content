name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, detekt, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint Kotlin (kotlinter)
        run: ./gradlew lintKotlin

      - name: Detekt
        if: success() || failure()
        run: ./gradlew detekt

      - name: Tests
        if: success() || failure()
        run: ./gradlew test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: build/reports/
          retention-days: 7
          if-no-files-found: ignore
